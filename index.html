<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonte carregada direto do HTML (antes vinha por @import dentro do CSS,
         o que só começava a baixá-la depois do CSS e do JS). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" />
    <title>Edcarlos Ramos — Portfólio</title>
    <script>
      // Tela de carregamento ativa (mesma condição do Preloader): esconde o
      // layout das seções abaixo do hero até o contador chegar a 100.
      if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
        document.documentElement.classList.add('is-loading')
      }

      // Rede de segurança: se o site não iniciar (script que não baixou,
      // navegador sem suporte, erro que derruba o React), em vez de ficar preso
      // numa tela preta ou no "Carregando" mostra um aviso com o motivo.
      ;(function () {
        var errors = []
        var shown = false
        var describe = function (e) {
          if (!e) return 'erro desconhecido'
          if (e.target && e.target !== window && (e.target.src || e.target.href)) {
            return 'falha ao baixar ' + (e.target.src || e.target.href)
          }
          var err = e.error || e.reason || e
          return String((err && (err.stack || err.message)) || e.message || err)
        }
        window.__siteFail = function (reason) {
          if (reason) errors.push(describe(reason))
          if (shown) return
          shown = true
          var show = function () {
            document.documentElement.classList.remove('is-loading')
            var boot = document.getElementById('boot-loader')
            if (boot) boot.remove()
            var box = document.createElement('div')
            box.setAttribute('role', 'alert')
            box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px;background:#000c17;color:#e5ebf1;font:16px/1.5 system-ui,sans-serif'
            var title = document.createElement('p')
            title.style.cssText = 'margin:0;font-size:20px;font-weight:600'
            title.textContent = 'Não foi possível carregar o site.'
            var button = document.createElement('button')
            button.type = 'button'
            button.textContent = 'Tentar de novo'
            button.style.cssText = 'align-self:flex-start;padding:10px 18px;border:0;border-radius:999px;background:#e5ebf1;color:#000c17;font:inherit;font-weight:600'
            button.onclick = function () { location.reload() }
            var details = document.createElement('details')
            details.style.cssText = 'font-size:12px;opacity:.7'
            var summary = document.createElement('summary')
            summary.textContent = 'Detalhes técnicos'
            var pre = document.createElement('pre')
            pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto'
            pre.textContent = errors.join('\n\n').slice(0, 4000) + '\n\n' + navigator.userAgent
            details.append(summary, pre)
            box.append(title, button, details)
            document.body.append(box)
          }
          if (document.body) show()
          else document.addEventListener('DOMContentLoaded', show)
        }
        // `true` (captura) também pega falha ao baixar um <script>.
        addEventListener('error', function (e) {
          errors.push(describe(e))
          if (e.target && e.target.tagName === 'SCRIPT') window.__siteFail()
        }, true)
        addEventListener('unhandledrejection', function (e) { errors.push(describe(e)) })
        setTimeout(function () {
          if (!window.__siteStarted) window.__siteFail('o site não iniciou em 15s')
        }, 15000)
      })()
    </script>
    <style>
      /* Cópia estática da tela de carregamento (src/components/Preloader.jsx):
         aparece no primeiro quadro, antes do JavaScript. O React desenha a
         mesma tela por cima e remove esta. Manter os dois iguais. */
      html { background: #000c17; }
      body { margin: 0; }
      html:not(.is-loading) #boot-loader { display: none; }
      #boot-loader { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #000c17; font-family: "Google Sans Flex", sans-serif; line-height: 1.5; }
      #boot-loader .bl-glow { position: absolute; left: calc(50% - min(70vw, 700px)); top: calc(100% - min(70vw, 700px)); width: min(140vw, 1400px); height: min(140vw, 1400px); border-radius: 50%; transform: scale(0.2); opacity: 0.25; background: radial-gradient(circle, #4c9be4 0%, color-mix(in oklab, #00417b 85%, transparent) 38%, color-mix(in oklab, #00417b 30%, transparent) 55%, transparent 70%); }
      #boot-loader .bl-content { position: relative; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: clamp(20px, 4vw, 56px) clamp(20px, 5vw, 72px); }
      #boot-loader .bl-title { margin: 0; font-weight: 500; letter-spacing: -0.01em; color: rgb(229 235 241 / 0.7); font-size: clamp(14px, 1.3vw, 18px); }
      #boot-loader .bl-count { margin: 0; font-weight: 600; letter-spacing: -0.04em; line-height: 0.8; font-variant-numeric: tabular-nums; font-size: clamp(96px, 22vw, 320px); background: linear-gradient(to bottom, #fff 28%, #c3f2ff 81%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #boot-loader .bl-bar { margin-top: clamp(16px, 2vw, 28px); height: 1px; background: rgb(229 235 241 / 0.15); }
      #boot-loader .bl-labels { margin-top: 12px; display: flex; justify-content: space-between; color: rgb(229 235 241 / 0.5); font-size: clamp(12px, 1vw, 14px); }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="bl-glow"></div>
      <div class="bl-content">
        <p class="bl-title">Edcarlos Ramos — Portfólio</p>
        <div>
          <p class="bl-count">000</p>
          <div class="bl-bar"></div>
          <div class="bl-labels"><span>Carregando</span><span>Analista de dados · Dev · Product Manager</span></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
